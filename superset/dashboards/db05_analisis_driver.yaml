# =============================================================================
# DB-05 - Tablero Analisis por driver · definicion declarativa (US-213)
# -----------------------------------------------------------------------------
# Historia : US-213 (Monserrat Xcaret Miranda Olivas, Celula 2 - Analytics & BI)
# Contrato : vault/04_UX_Design/Cube_Specs_DB05_DB08.md §3-§4
# Consumido por : superset/sync_semantic_layer.py (idempotente)
#
# Un tab por driver (D1-D6): driver dominante de ML-02 (KPI-07), cobertura y evolucion por ciclo,
# con desglose municipal. El filtro por driver de cada tab NO es codigo -- es
# un `adhoc_filters` declarado en `params_extra` (mecanismo aprobado por
# Manuel Serrania, US-202): filtra id_driver = 'Dx' antes de agregar, sobre el
# mismo dataset db05_cubo_driver que ya usan los otros 5 tabs.
#
# Los 6 tabs siguen el mismo patron validado con D1 (estructura, YAML y datos
# reales de Gold via dbt): mismo juego de 6 charts, filtrado por su propio
# id_driver via adhoc_filters/params_extra, con la nota de fuente por driver
# (Cube_Specs_DB05_DB08.md §3.3).
# =============================================================================

version: "1.0"
owner: "Monserrat Xcaret Miranda Olivas"
story: US-213

dashboards:
  - titulo: "DB-05 · Análisis por driver"
    slug: db05-analisis-driver
    descripcion: >
      Un tab por driver (D1-D6): % de escuelas por driver dominante (KPI-07) y cobertura, evolución por ciclo,
      con desglose municipal. Contrato: vault/04_UX_Design/Cube_Specs_DB05_DB08.md.
    filtros_globales:
      - columna: id_ciclo
        etiqueta: "Ciclo escolar"
        valor_por_defecto: "2024-2025"
        datasets: [db05_cubo_driver]
        default: ultimo_ciclo
      - columna: nombre_entidad
        etiqueta: "Entidad"
        datasets: [db05_cubo_driver]
      - columna: nivel
        etiqueta: "Nivel educativo"
        datasets: [db05_cubo_driver]

    tabs:
      - id: D1
        etiqueta: "D1 · Pobreza y rezago social"
        nota: "CONEVAL (DS-07) · medido a nivel municipio"
        charts:
          - nombre: "D1 · KPI-07 · % escuelas por driver dominante"
            dataset: db05_cubo_driver
            metrica: pct_escuelas_por_driver
            viz: big_number_total
            ancho: 3
            alto: 38
            subheader: "En el alcance filtrado"
            params_extra:
              adhoc_filters:
                - expressionType: SIMPLE
                  subject: id_driver
                  operator: "=="
                  comparator: "D1"
                  clause: WHERE

          - nombre: "D1 · Escuelas por driver dominante"
            dataset: db05_cubo_driver
            metrica: escuelas_por_driver
            viz: big_number_total
            ancho: 3
            alto: 38
            params_extra:
              adhoc_filters:
                - {expressionType: SIMPLE, subject: id_driver, operator: "==", comparator: "D1", clause: WHERE}

          - nombre: "D1 · % escuelas sin recomendación"
            dataset: db05_cubo_driver
            metrica: pct_escuelas_sin_recomendacion
            viz: big_number_total
            ancho: 3
            alto: 38
            subheader: "Complemento a KPI-07 · SIN_DATO explícito (R2)"
            params_extra:
              adhoc_filters:
                - {expressionType: SIMPLE, subject: id_driver, operator: "==", comparator: "D1", clause: WHERE}

          - nombre: "D1 · Escuelas con recomendación"
            dataset: db05_cubo_driver
            metrica: escuelas_con_recomendacion
            viz: big_number_total
            ancho: 3
            alto: 38
            params_extra:
              adhoc_filters:
                - {expressionType: SIMPLE, subject: id_driver, operator: "==", comparator: "D1", clause: WHERE}

          - nombre: "D1 · % escuelas por driver dominante por ciclo"
            dataset: db05_cubo_driver
            metrica: pct_escuelas_por_driver
            viz: echarts_timeseries_line
            ancho: 6
            alto: 60
            eje_x: ciclo
            params_extra:
              adhoc_filters:
                - {expressionType: SIMPLE, subject: id_driver, operator: "==", comparator: "D1", clause: WHERE}

          - nombre: "D1 · Municipios · driver dominante y cobertura"
            dataset: db05_cubo_driver
            metrica: pct_escuelas_por_driver
            viz: table
            ancho: 6
            alto: 60
            dimensiones: [nombre_entidad, nombre_municipio, nivel, total_escuelas, escuelas_con_recomendacion, cobertura_recomendacion, link_db08]
            row_limit: 100
            params_extra:
              adhoc_filters:
                - {expressionType: SIMPLE, subject: id_driver, operator: "==", comparator: "D1", clause: WHERE}
              allow_render_html: true

