# =============================================================================
# Tarjetas de KPI globales (US-221) — MAPEO canónico, sin SQL duplicado
# -----------------------------------------------------------------------------
# Decisión (ratificada por Manuel Serranía, dueño del catálogo US-201): las
# "KPIs globales" de Screen_Specs.md §2 (AC-002.5: todo tablero muestra al
# menos matrícula, riesgo y una serie de tiempo) NO crean datasets ni SQL
# propios. La fórmula canónica vive en Screen_Specs.md §4 y la métrica ya está
# declarada en el metrics_*.yaml del dataset que la expone.
#
# Este archivo es el mapa: tarjeta -> dataset.metrica -> yaml de métricas.
# Si una tarjeta repite un KPI ya cubierto por un dataset del proyecto, se
# referencia, nunca se reconstruye (regla 1 del vault · antecedente del `*100`
# duplicado en 3 tableros: DB-01, DB-03/04 y US-211b).
#
# Regla antiduplicación (garantizada por tests/test_kpis_us221.py):
#   * No debe existir ningún `kpi_*.sql` en superset/semantic/.
#   * Toda tarjeta debe apuntar a una métrica real de un dataset real.
# =============================================================================

version: "1.0"
owner: "Oscar Antonio Quiroz Lázaro"
story: US-221
traces_up: ["vault/04_UX_Design/Screen_Specs", "US-201"]
ratificado_por: "Manuel Alejandro Serranía Reinada (US-201, dueño del catálogo)"

filtros_globales:
  - columna: id_ciclo
    tipo: temporal
  - columna: cve_ent
    tipo: categorico
    dominio: ["09", "15", "19", "14"]
  - columna: nivel
    tipo: categorico

tarjetas:
  - kpi: KPI-01
    etiqueta: "Matrícula total"
    formato_d3: ",d"
    fuente:
      dataset: db01_cubo_matricula
      metrica: matricula_total
      yaml_metricas: metrics_db01_db02.yaml

  - kpi: KPI-02
    etiqueta: "Variación de matrícula"
    formato_d3: ",.1%"
    nota: "Razón (fracción, nunca *100) · DEC-008/BUG-031: SUM(matricula_total)/NULLIF(SUM(suma_matricula_anterior), 0) - 1."
    fuente:
      dataset: db01_cubo_matricula
      metrica: variacion_ponderada_pct
      yaml_metricas: metrics_db01_db02.yaml

  - kpi: KPI-03
    etiqueta: "Índice de riesgo promedio"
    formato_d3: ",.2f"
    nota: "JOIN interno a predicciones ML-01: las escuelas SIN_DATO se excluyen, nunca cuentan como 0."
    fuente:
      dataset: db02_cubo_riesgo_territorial
      metrica: indice_riesgo_promedio
      yaml_metricas: metrics_db01_db02.yaml

  - kpi: KPI-04
    etiqueta: "Escuelas en riesgo"
    formato_d3: ",d"
    nota: "Umbral ratificado DEC-019: indice_riesgo >= 0.5 (alineado al cubo Gold de C1). Mostrar junto a escuelas_con_prediccion (denominador visible)."
    fuente:
      dataset: db02_cubo_riesgo_territorial
      metrica: escuelas_en_riesgo
      yaml_metricas: metrics_db01_db02.yaml

  - kpi: KPI-08
    etiqueta: "Escuelas por nivel educativo"
    formato_d3: ",d"
    nota: "Un valor por nivel (Preescolar…Media Superior). No confundir con % de matrícula."
    fuente:
      dataset: db01_distribucion_escuelas
      metrica: escuelas
      yaml_metricas: metrics_db01_db02.yaml

reutilizacion:
  contrato:
    - "Una sola implementación por KPI: la métrica canónica del dataset del tablero."
    - "Los filtros globales (ciclo/entidad/nivel, AC-002.2) se aplican igual en cualquier tablero que embeba la tarjeta."
    - "Cobertura KPI-01/02/05 en DB-01/DB-06; KPI-03/04 en DB-02/DB-06/DB-09; KPI-08 en DB-01 (Screen_Specs §4)."
  consumido_por:
    - dashboard: DB-01 Ejecutivo
      responsable: "Manuel Alejandro Serranía Reinada (US-203)"
    - dashboard: DB-02 Mapa de riesgo
      responsable: "Manuel Alejandro Serranía Reinada (US-203)"