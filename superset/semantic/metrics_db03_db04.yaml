# =============================================================================
# Capa semantica de DB-03 y DB-04 - metricas, jerarquias y filtros
# -----------------------------------------------------------------------------
# Historia : US-211a (Marina Garcia del Buey, Celula 2 - Analytics & BI)
# Contrato : vault/04_UX_Design/Cube_Specs_DB03_DB04.md (DOC-CUBESPEC-DB0304)
# Uso      : declaracion de las metricas que se dan de alta en Superset al
#            construir DB-03 y DB-04 (US-212). Formato propio del proyecto,
#            no un export nativo de Superset: la convencion definitiva la fija
#            Manuel en US-202 y este archivo se alinea con ella.
#
# Regla transversal: toda razon se expresa como SUM(numerador)/SUM(denominador)
# para que se pueda reagregar con cualquier combinacion de filtros globales.
# Ninguna metrica usa COALESCE(<driver>, 0): SIN_DATO nunca se dibuja como cero.
# =============================================================================

version: "1.0"
owner: "Marina García del Buey"
story: US-211a
traces_up: DOC-CUBESPEC-DB0304

# -----------------------------------------------------------------------------
# Filtros globales (AC-002.2) - aplican a los dos tableros
# -----------------------------------------------------------------------------
filtros_globales:
  - nombre: ciclo
    columna: id_ciclo
    etiqueta: "Ciclo escolar"
    default: ultimo_ciclo
  - nombre: entidad
    columna: cve_ent
    etiqueta: "Entidad"
    nota: "Acotado a SCOPE_ENTIDADES (09, 15, 19, 14)"
  - nombre: nivel
    columna: nivel
    etiqueta: "Nivel educativo"

# -----------------------------------------------------------------------------
# DB-03 - Ficha de escuela
# -----------------------------------------------------------------------------
datasets:
  - nombre: cubo_escuela_360
    dashboard: DB-03
    sql: db03_cubo_escuela_360.sql
    grano: [cct, id_ciclo]
    llave_primaria: [cct, id_ciclo]
    banderas_cobertura:
      - d1_cobertura
      - d2_cobertura
      - d3_cobertura
      - d4_cobertura
      - d5_cobertura
      - d6_cobertura
      - cobertura_prediccion
      - cobertura_recomendacion

    jerarquias:
      - nombre: territorio
        niveles: [cve_ent, cve_mun, cct]
      - nombre: tiempo
        niveles: [anio_inicio, id_ciclo]

    metricas:
      - nombre: matricula_total
        etiqueta: "Matrícula total"
        expresion: "SUM(matricula_total)"
        formato: entero
        kpi: KPI-01
      - nombre: variacion_ponderada_pct
        etiqueta: "Variación de matrícula"
        expresion: "SUM(matricula_total) * 1.0 / NULLIF(SUM(matricula_ciclo_anterior), 0) - 1"
        formato: porcentaje_1
        kpi: KPI-02
        nota: >
          Razón de sumas, NO promedio ponderado de razones. Usa la columna directa
          `matricula_ciclo_anterior`, que C1 ya expone en gold.cubo_escuela_360 (BUG-031, ADR-007);
          antes se rodeaba con `matricula_total - variacion_matricula` porque la columna aún no
          existía. La versión original —SUM(variacion_matricula * matricula_total) /
          SUM(matricula_total)— trataba `variacion_matricula` como una fracción cuando son alumnos
          absolutos (`matricula_total - matricula_ciclo_anterior`): pintaba -54.5% donde el valor
          real es -0.19%. El `* 1.0` fuerza la división real (SUM(integer) es bigint y bigint/bigint
          truncaría a entero) y es portable, sin meter un token de tipo en la expresión.
      - nombre: completitud_promedio
        etiqueta: "Completitud de drivers"
        expresion: "AVG(indice_completitud_drivers)"
        formato: porcentaje_0
        kpi: KPI-05
      - nombre: indice_riesgo
        etiqueta: "Índice de riesgo"
        expresion: "AVG(indice_riesgo)"
        formato: decimal_2
        kpi: KPI-03
        cobertura: cobertura_prediccion
        nota: "Si cobertura_prediccion = SIN_DATO se muestra 'sin dato disponible', nunca 0"
      - nombre: escuelas_en_riesgo
        etiqueta: "Escuelas en riesgo"
        expresion: "COUNT(*) FILTER (WHERE en_riesgo)"
        formato: entero
        kpi: KPI-04
        umbral: 0.6
      - nombre: drivers_sin_dato
        etiqueta: "Drivers sin dato"
        expresion: "6 - ROUND(AVG(indice_completitud_drivers) * 6)"
        formato: entero

    # Publicados por Manuel en vault/04_UX_Design/Screen_Specs.md §4 el 2026-08-15
    # (US-201). El catalogo de Manuel es la fuente canonica; esta lista queda
    # como registro del origen de la propuesta (Cube_Specs §5.1).
    kpis_canonicos:
      - id: KPI-15
        nombre: "Perfil de matrícula de la escuela"
        sustenta: [AC-002.4, AC-002.5]
      - id: KPI-16
        nombre: "Perfil de drivers de la escuela"
        sustenta: [AC-002.4, AC-002.6]
      - id: KPI-17
        nombre: "Predicción de la escuela"
        sustenta: [AC-002.4]
      - id: KPI-18
        nombre: "Recomendación prescriptiva de la escuela"
        sustenta: [AC-002.4]

  # ---------------------------------------------------------------------------
  # DB-04 - Comparador de municipios
  # ---------------------------------------------------------------------------
  - nombre: cubo_comparador_municipio
    dashboard: DB-04
    sql: db04_cubo_comparador_municipio.sql
    grano: [cve_mun, nivel, id_ciclo]
    llave_primaria: [cve_mun, nivel, id_ciclo]
    # Grano ratificado por Diana Alvarez (C1) el 2026-08-14 y registrado como
    # DEC-008: se bajo de `municipio x ciclo` a `municipio x nivel x ciclo` para
    # poder cumplir AC-002.2 (filtro global por nivel) en DB-04.
    grano_ratificado_en: "DEC-008 · Data_Model.md §4.3"
    banderas_cobertura:
      - escuelas_con_d1
      - escuelas_con_d2
      - escuelas_con_d3
      - escuelas_con_d4
      - escuelas_con_d5
      - escuelas_con_d6
      - cobertura_riesgo

    jerarquias:
      - nombre: territorio
        niveles: [cve_ent, cve_mun]
      - nombre: oferta
        niveles: [cve_mun, nivel]
      - nombre: tiempo
        niveles: [anio_inicio, id_ciclo]

    metricas:
      - nombre: escuelas
        etiqueta: "Escuelas"
        expresion: "SUM(escuelas)"
        formato: entero
      - nombre: matricula_total
        etiqueta: "Matrícula total"
        expresion: "SUM(matricula_total)"
        formato: entero
        kpi: KPI-01
      # RESTITUIDA (BUG-031/P-09): C1 ya expone `suma_matricula_anterior` en el cubo
      # (SUM de matricula_ciclo_anterior, bigint). Razón de sumas, no promedio ponderado de
      # razones: la versión con `variacion_x_matricula` pintaba -54.5% donde el real es -0.19%.
      # No lleva `::numeric`: SUM(bigint) ya devuelve numeric, la división es real.
      - nombre: variacion_ponderada_pct
        etiqueta: "Variación de matrícula"
        expresion: "SUM(matricula_total) / NULLIF(SUM(suma_matricula_anterior), 0) - 1"
        formato: porcentaje_1
        kpi: KPI-02
      - nombre: matricula_por_escuela
        etiqueta: "Matrícula por escuela"
        expresion: "SUM(matricula_total) / NULLIF(SUM(escuelas), 0)"
        formato: decimal_1
      - nombre: indice_riesgo_promedio
        etiqueta: "Índice de riesgo promedio"
        expresion: "SUM(suma_indice_riesgo) / NULLIF(SUM(escuelas_con_prediccion), 0)"
        formato: decimal_2
        kpi: KPI-03
        cobertura: cobertura_riesgo
      - nombre: escuelas_en_riesgo
        etiqueta: "Escuelas en riesgo"
        expresion: "SUM(escuelas_en_riesgo)"
        formato: entero
        kpi: KPI-04
        umbral: 0.6
      - nombre: pct_escuelas_en_riesgo
        etiqueta: "% escuelas en riesgo"
        expresion: "SUM(escuelas_en_riesgo) / NULLIF(SUM(escuelas_con_prediccion), 0)"
        formato: porcentaje_1
        denominador_visible: escuelas_con_prediccion
        nota: >
          Divide entre escuelas con predicción, no entre el total. Decir "10% en riesgo"
          cuando solo el 30% fue puntuada inventaría una cobertura que no existe.
          SIN `* 100`: el formato `porcentaje_1` ya se mapea al d3 ",.1%", que multiplica
          por 100 al renderizar. Con ambos, 0.318 se pintaría como "3,180.0%".
      - nombre: completitud_promedio
        etiqueta: "Completitud de drivers"
        expresion: "SUM(suma_completitud) / NULLIF(SUM(escuelas), 0)"
        formato: porcentaje_0
        kpi: KPI-05
      - nombre: d1_promedio
        etiqueta: "D1 · Pobreza y rezago social"
        expresion: "SUM(suma_d1) / NULLIF(SUM(escuelas_con_d1), 0)"
        formato: decimal_2
        cobertura: escuelas_con_d1
      - nombre: d2_promedio
        etiqueta: "D2 · Inseguridad del entorno"
        expresion: "SUM(suma_d2) / NULLIF(SUM(escuelas_con_d2), 0)"
        formato: decimal_2
        cobertura: escuelas_con_d2
      - nombre: d3_promedio
        etiqueta: "D3 · Infraestructura escolar"
        expresion: "SUM(suma_d3) / NULLIF(SUM(escuelas_con_d3), 0)"
        formato: decimal_2
        cobertura: escuelas_con_d3
      - nombre: d4_promedio
        etiqueta: "D4 · Conectividad digital"
        expresion: "SUM(suma_d4) / NULLIF(SUM(escuelas_con_d4), 0)"
        formato: decimal_2
        cobertura: escuelas_con_d4
      - nombre: d5_promedio
        etiqueta: "D5 · Estrés hídrico"
        expresion: "SUM(suma_d5) / NULLIF(SUM(escuelas_con_d5), 0)"
        formato: decimal_2
        cobertura: escuelas_con_d5
      - nombre: d6_promedio
        etiqueta: "D6 · Calidad del aire"
        expresion: "SUM(suma_d6) / NULLIF(SUM(escuelas_con_d6), 0)"
        formato: decimal_2
        cobertura: escuelas_con_d6
      - nombre: contexto_socioeconomico
        etiqueta: "Contexto socioeconómico"
        columnas: [poblacion, pobreza_pct, grado_rezago, indice_rezago_social]
        kpi: KPI-14

# -----------------------------------------------------------------------------
# Navegacion cruzada — US-214a
# -----------------------------------------------------------------------------
# El contrato lo declaro US-211a; US-214a lo implementa y, al hacerlo, encontro
# que tres de las siete rutas no eran ejecutables como estaban escritas. Se
# corrigen aqui y cada una lleva su `estado`, para que la brecha entre lo
# declarado y lo construido sea legible sin abrir el codigo.
#
# Mecanismo (US-214b, Monserrat): columna calculada con <a href> +
# `native_filters` en RISON. Superset no tiene columna tipo link nativa
# (SIP-77 rechazada) y ni el cross-filtering ni "Drill to Detail" cruzan de un
# tablero a otro. Los IDs de filtro se fijan POR POSICION en `filtros_globales`
# del tablero destino: NATIVE_FILTER-US203-{indice}.
#
# estado: implementado | bloqueado | ajeno
drill_down:
  - desde: DB-01
    hacia: DB-03
    llave: cct
    estado: ajeno
    nota: >
      El link vive en el SQL de DB-01 (`db01_*.sql`, US-203 · Manuel Serrania),
      no en los archivos de esta historia. Pendiente de acordar con el.
  - desde: DB-02
    hacia: DB-03
    llave: cct
    estado: ajeno
    nota: >
      Igual que la anterior: el origen es `db02_puntos_escuela.sql` (Manuel).
  - desde: DB-02
    hacia: DB-04
    llave: cve_mun
    estado: ajeno
    nota: >
      Origen ajeno (Manuel). El destino ya quedo listo: US-214a agrego el
      filtro `cve_mun` a db04_comparador_municipio.yaml en el indice 4, asi
      que cuando Manuel escriba el link solo tiene que apuntar a ese indice.
  - desde: DB-03
    hacia: DB-04
    llave: cve_mun
    estado: implementado
    nota: >
      Columna `link_db04` en db03_cubo_escuela_360.sql. Fija id_ciclo
      (indice 0) y cve_mun (indice 4) del tablero destino.
  - desde: DB-03
    hacia: DB-06
    llave: [cct, id_ciclo]
    estado: implementado
    nota: >
      DESBLOQUEADA el 2026-09-04. Manuel Serrania agrego `cct` al final de los
      filtros_globales de db06_predicciones.yaml (PR #215), en el indice 3 y solo
      sobre el dataset de grano escuela `db06_predicciones_escuela`. Columna
      `link_db06` en db03_cubo_escuela_360.sql; fija id_ciclo (indice 0) y cct
      (indice 3). Los charts que leen `db06_cubo_predicciones` (grano municipio x
      nivel) no se filtran por cct y esta bien: ese cubo no tiene la columna.
  - desde: DB-03
    hacia: DB-09
    llave: [cct, id_ciclo]
    estado: implementado
    nota: >
      DESBLOQUEADA el 2026-09-04 por el mismo PR #215 de Manuel Serrania. Columna
      `link_db09` en db03_cubo_escuela_360.sql; fija id_ciclo (indice 0) y cct
      (indice 3) de db09_recomendaciones.yaml.
  - desde: DB-04
    hacia: DB-03
    llave: cve_mun
    estado: implementado
    nota: >
      CORRECCION DE CONTRATO (US-214a). US-211a declaro esta ruta con llave
      `cct`, y es imposible: DEC-008 fijo el grano de DB-04 en
      [cve_mun, nivel, id_ciclo] y `gold.cubo_comparador_municipio` no tiene
      columna `cct`. La llave real es `cve_mun` — desde un municipio se baja a
      SUS escuelas, y el usuario elige cual. Columna `link_db03` en
      db04_cubo_comparador_municipio.sql; fija id_ciclo (indice 1) y cve_mun
      (indice 4) de DB-03, y deja `cct` (indice 0) libre a proposito.
