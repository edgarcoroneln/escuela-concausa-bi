# ═══════════════════════════════════════════════════════════════════════
# FARO — Docker Compose Completo
# ═══════════════════════════════════════════════════════════════════════
# Servicios:
#   - db                → PostgreSQL 15 (4 bases de datos: escuela_concausa_db, airflow, mlflow, superset)
#   - api               → FastAPI (backend)
#   - airflow-init      → Inicialización de Airflow (corre 1 vez)
#   - airflow-webserver → UI de Airflow (puerto 8080)
#   - airflow-scheduler → Orquestador de DAGs
#   - mlflow            → Tracking de modelos ML (puerto 5000)
#   - superset          → Dashboards BI (puerto 8088)
#   - chromadb          → Vector database para agente RAG (puerto 8001)
#
# Puertos expuestos:
#   5432 → Postgres    |  8000 → FastAPI   |  8080 → Airflow
#   5001 → MLflow      |  8088 → Superset  |  8001 → ChromaDB
#
# Creado: 2026-08-15 por Luis Téllez Domínguez (Célula 5)
# Historia: US-502
#
# NOTA (2026-08-29): Se eliminaron los `container_name` fijos. Los nombres de
# contenedor son GLOBALES en Docker, por lo que un `container_name: faro-*`
# colisiona entre la copia principal del repo y cualquier git worktree que
# levante el mismo stack. Sin `container_name`, Compose nombra los contenedores
# como `<proyecto>-<servicio>-<N>` (el proyecto = nombre de la carpeta), lo que
# permite que varias copias coexistan. Referirse SIEMPRE a los servicios por su
# nombre de servicio (db, api, mlflow, …), tanto en la red interna como en los
# scripts de verificación (`docker compose exec <servicio>`).
# ═══════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────
# RED INTERNA
# ───────────────────────────────────────────────────────────────────────
networks:
  faro-network:
    driver: bridge
    name: faro-network

# ───────────────────────────────────────────────────────────────────────
# VOLÚMENES PERSISTENTES
# ───────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: faro-postgres-data
  airflow-logs:
    name: faro-airflow-logs
  airflow-plugins:
    name: faro-airflow-plugins
  mlflow-artifacts:
    name: faro-mlflow-artifacts
  superset-data:
    name: faro-superset-data
  chroma-data:
    name: faro-chroma-data

# ───────────────────────────────────────────────────────────────────────
# SERVICIOS
# ───────────────────────────────────────────────────────────────────────
services:

  # ═════════════════════════════════════════════════════════════════════
  # POSTGRES 15 (4 bases de datos)
  # ═════════════════════════════════════════════════════════════════════
  db:
    image: postgis/postgis:15-3.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"  # Solo localhost (seguridad)
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - faro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═════════════════════════════════════════════════════════════════════
  # FASTAPI (Backend)
  # ═════════════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        # Sella la imagen con el commit; /api/v1/version lo reporta. Exporta GIT_SHA
        # antes de `docker compose build` (p.ej. GIT_SHA=$(git rev-parse HEAD)); si no,
        # queda "dev". No confundir con GIT_COMMIT, que es la ENV que fija el Dockerfile.
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      PORT: ${API_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"  # Solo localhost (seguridad)
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    networks:
      - faro-network
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck heredado del Dockerfile (usa python, no curl - BUG-006)
    # El Dockerfile ya define un healthcheck funcional con urllib.request

  # ═════════════════════════════════════════════════════════════════════
  # AIRFLOW INIT (Setup inicial, corre 1 sola vez)
  # ═════════════════════════════════════════════════════════════════════
  airflow-init:
    image: apache/airflow:2.7.0-python3.11
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__DATABASE__SQL_ALCHEMY_ENGINE_ARGS: '{"executemany_mode": "values_plus_batch", "executemany_values_page_size": 10000, "executemany_batch_page_size": 2000}'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
      _AIRFLOW_WWW_USER_FIRSTNAME: FARO
      _AIRFLOW_WWW_USER_LASTNAME: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@faro.local
      _AIRFLOW_WWW_USER_ROLE: Admin
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    networks:
      - faro-network
    depends_on:
      db:
        condition: service_healthy
    user: "${AIRFLOW_UID:-50000}:0"
    command: version

  # ═════════════════════════════════════════════════════════════════════
  # AIRFLOW WEBSERVER (UI Web - puerto 8080)
  # ═════════════════════════════════════════════════════════════════════
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__DATABASE__SQL_ALCHEMY_ENGINE_ARGS: '{"executemany_mode": "values_plus_batch", "executemany_values_page_size": 10000, "executemany_batch_page_size": 2000}'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    ports:
      - "127.0.0.1:8080:8080"  # Solo localhost (seguridad)
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    networks:
      - faro-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: webserver

  # ═════════════════════════════════════════════════════════════════════
  # AIRFLOW SCHEDULER (Orquestador de DAGs)
  # ═════════════════════════════════════════════════════════════════════
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__DATABASE__SQL_ALCHEMY_ENGINE_ARGS: '{"executemany_mode": "values_plus_batch", "executemany_values_page_size": 10000, "executemany_batch_page_size": 2000}'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    networks:
      - faro-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: scheduler

  # ═════════════════════════════════════════════════════════════════════
  # MLFLOW (Tracking de modelos ML - puerto 5001)
  # ═════════════════════════════════════════════════════════════════════
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: faro-mlflow:3.15.1
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
    ports:
      - "127.0.0.1:5001:5000"  # Solo localhost (seguridad)
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    networks:
      - faro-network
    depends_on:
      db:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
      --default-artifact-root ${MLFLOW_ARTIFACT_ROOT}
      --host 0.0.0.0
      --port 5000

  # ═════════════════════════════════════════════════════════════════════
  # SUPERSET (Dashboards BI - puerto 8088)
  # ═════════════════════════════════════════════════════════════════════
  superset:
    build:
      context: .
      dockerfile: docker/superset.Dockerfile
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      DATABASE_DB: superset
      DATABASE_HOST: db
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
    ports:
      - "127.0.0.1:8088:8088"  # Solo localhost (seguridad)
    volumes:
      - superset-data:/app/superset_home
      - ./docker/superset-init.sh:/app/superset-init.sh:ro
    networks:
      - faro-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: ["/bin/bash", "/app/superset-init.sh"]

  # ═════════════════════════════════════════════════════════════════════
  # CHROMADB (Vector Database para agente RAG - puerto 8001)
  # ═════════════════════════════════════════════════════════════════════
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"  # Solo localhost (seguridad)
    volumes:
      - chroma-data:/chroma/data
      - ./docker/chromadb-entrypoint.sh:/docker-entrypoint.d/00-security-warning.sh:ro
    networks:
      - faro-network
    environment:
      IS_PERSISTENT: 1
      ANONYMIZED_TELEMETRY: 0
      ENVIRONMENT: ${ENVIRONMENT:-local}
    healthcheck:
      # La imagen chromadb/chroma:latest NO trae curl/wget/python (exec: "curl": not
      # found -> falso "unhealthy" aunque el servicio responde). Se usa bash (sí presente)
      # con /dev/tcp para hablar HTTP al heartbeat sin dependencias externas.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s