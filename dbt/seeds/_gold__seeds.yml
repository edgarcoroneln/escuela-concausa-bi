version: 2

seeds:
  - name: dim_driver
    description: >
      Dimensión de catálogo de drivers de riesgo — 6 filas fijas (D1...D6),
      una por cada factor de negocio del proyecto (gold.dim_driver, Data_Model.md §4.2).
      Mapeo D3=infraestructura/D4=conectividad documentado en ADR-004.
    columns:
      - name: id_driver
        description: PK — identificador del driver (D1...D6)
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['D1', 'D2', 'D3', 'D4', 'D5', 'D6']

      - name: nombre
        description: >
          Nombre corto del driver -- catálogo canónico (BUG-022, 2026-08-29): estos son los
          ÚNICOS valores válidos. `superset/mock/gold_estrella_mock.sql` (mock previo a que este
          seed existiera) crea `gold.dim_driver` con `CREATE TABLE IF NOT EXISTS` + `INSERT ...
          ON CONFLICT DO NOTHING` usando nombres largos distintos ("Pobreza y rezago social" en
          vez de "Pobreza"). Si ese mock corre en un entorno donde `dbt seed`/`dbt build` nunca se
          ejecutó, la tabla se queda con esos nombres viejos y nada lo detecta -- probado que
          `dbt seed --select dim_driver` sí reemplaza esos datos correctamente en cuanto se corre
          (con o sin `--full-refresh`), así que el desface real es "seed nunca corrido", no un
          conflicto de PK. Este test detecta el catálogo divergente en vez de dejarlo fallar en
          silencio en Superset (HTTP 500 río abajo).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Pobreza', 'Inseguridad', 'Infraestructura', 'Conectividad', 'Agua', 'Aire']

      - name: fuente
        description: DS que alimenta este driver
        tests:
          - not_null

      - name: cobertura
        description: Cobertura geográfica/temporal de la fuente
        tests:
          - not_null

      - name: nivel_geografico
        description: Nivel de agregación geográfica (escuela/municipio/region)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['escuela', 'municipio', 'region']

  - name: dim_entidad
    description: >
      Catálogo canónico de las 4 SCOPE_ENTIDADES del proyecto (Data_Model.md §7,
      dbt/macros/scope_entidades.sql) — cve_ent -> nombre_entidad oficial. Creado para BUG-077
      (2026-09-12, Edgar Coronel, regresión QA): `gold.dim_municipio.nombre_entidad` se tomaba
      de `silver.rezago_municipio` (CONEVAL) por LEFT JOIN, bajo el supuesto de que CONEVAL
      cubre el 100% del universo INEGI de municipios -- supuesto falso en el Postgres local
      verificado (307 de 317 filas con `nombre_entidad` NULL), lo que rompía
      `GET /api/v1/municipios` con 500 vía `MunicipioOut.nombre_entidad: StrictStr`. El nombre de
      la entidad no depende de ningún dato externo variable -- las 4 entidades del alcance son
      fijas y conocidas -- así que se resuelve como catálogo propio en vez de heredar la
      cobertura parcial de una fuente ajena (mismo criterio que `dim_driver`, BUG-022).
    columns:
      - name: cve_ent
        description: PK — clave INEGI de entidad (2 dígitos), mismo universo de `scope_entidades()`
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['09', '15', '19', '14']

      - name: nombre_entidad
        description: Nombre oficial de la entidad (Data_Model.md §7)
        tests:
          - not_null
          - unique