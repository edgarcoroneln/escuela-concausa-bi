version: 2

models:
  - name: matricula
    description: "Silver nacional de DS-01 Formato 911, tipada, homologada y deduplicada a nivel CCT por ciclo escolar."

    columns:
      - name: cct
        description: "Clave de Centro de Trabajo homologada a 10 caracteres."
        data_tests:
          - not_null

      - name: ciclo
        description: "Ciclo escolar."
        data_tests:
          - not_null

      - name: cve_ent
        description: "Clave INEGI de entidad a 2 dígitos."
        data_tests:
          - not_null

      - name: cve_mun
        description: "Clave INEGI municipal homologada a 5 dígitos."
        data_tests:
          - not_null

      - name: alumnos_total
        description: "Matrícula total reportada por escuela y ciclo."

      - name: docentes_total
        description: "Total de docentes reportados por escuela y ciclo."

      - name: grupos_total
        description: "Total de grupos reportados por escuela y ciclo."

  - name: matricula_historica
    description: >
      Silver nacional de DS-01 Formato 911, distribución HISTÓRICA multi-ciclo (2019-2020..
      2024-2025), tipada, homologada y sumada por turno a nivel CCT×ciclo. Aislada de
      `matricula` (ciclo único 2024-2025) — mitigación de RISK-007/DEC-007.

    columns:
      - name: cct
        description: "Clave de Centro de Trabajo homologada a 10 caracteres."
        data_tests:
          - not_null

      - name: ciclo
        description: "Ciclo escolar."
        data_tests:
          - not_null

      - name: cve_ent
        description: "Clave INEGI de entidad a 2 dígitos."
        data_tests:
          - not_null

      - name: cve_mun
        description: "Clave INEGI municipal homologada a 5 dígitos."
        data_tests:
          - not_null

      - name: nivel
        description: "Nivel educativo, normalizado a MAYÚSCULAS para hacer match con gold.dim_escuela.nivel (DS-02)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['PREESCOLAR', 'PRIMARIA', 'SECUNDARIA']

      - name: matricula_total
        description: "Matrícula total de la escuela en el ciclo (suma de todos los turnos reportados)."
        data_tests:
          - not_null

  - name: escuela
    description: "Silver nacional de DS-02 Catálogo CCT, tipada, homologada y deduplicada a una fila por escuela."

    columns:
      - name: cct
        description: "Clave primaria de Centro de Trabajo homologada a 10 caracteres."
        data_tests:
          - not_null
          - unique

      - name: cve_ent
        description: "Clave INEGI de entidad homologada a 2 dígitos."
        data_tests:
          - not_null

      - name: cve_mun
        description: "Clave INEGI municipal homologada a 5 dígitos."
        data_tests:
          - not_null

  - name: cemabe
    description: "Silver nacional de DS-03 CEMABE, homologada a una fila por CCT con drivers de infraestructura y cobertura explícita SIN_DATO."

    columns:
      - name: cct
        description: "Clave de Centro de Trabajo homologada a 10 caracteres."
        data_tests:
          - not_null
          - unique

      - name: agua
        data_tests:
          - accepted_values:
              arguments:
                values: ['0', '1', 'SIN_DATO']

      - name: drenaje
        data_tests:
          - accepted_values:
              arguments:
                values: ['0', '1', 'SIN_DATO']

      - name: electricidad
        data_tests:
          - accepted_values:
              arguments:
                values: ['0', '1', 'SIN_DATO']

      - name: sanitarios
        data_tests:
          - accepted_values:
              arguments:
                values: ['0', '1', 'SIN_DATO']

      - name: internet
        data_tests:
          - accepted_values:
              arguments:
                values: ['0', '1', 'SIN_DATO']

      - name: computadoras
        data_tests:
          - accepted_values:
              arguments:
                values: ['0', '1', 'SIN_DATO']

  - name: delitos_municipio
    description: "Silver nacional de DS-04 SESNSP, tipada y deduplicada a nivel municipio, mes y tipo de delito."

    columns:
      - name: cve_ent
        description: "Clave INEGI de entidad homologada a 2 dígitos."
        data_tests:
          - not_null

      - name: cve_mun
        description: "Clave INEGI municipal homologada a 5 dígitos."
        data_tests:
          - not_null

      - name: anio
        data_tests:
          - not_null

      - name: mes
        data_tests:
          - not_null

      - name: tipo_delito
        data_tests:
          - not_null

      - name: conteo
        description: "Conteo canónico Silver; origen físico pendiente de confirmar como víctimas o carpetas."
        data_tests:
          - not_null

  - name: aire_estacion
    description: "Silver nacional de DS-05 SINAICA a nivel estación, parámetro y hora, con georreferencia para cobertura IDW."

    columns:
      - name: id_estacion
        data_tests:
          - not_null

      - name: parametro
        data_tests:
          - not_null

      - name: fecha
        data_tests:
          - not_null

      - name: hora
        data_tests:
          - not_null

      - name: dato_valido
        description: "Bandera SINAICA de validez del dato (0/1)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: latitud
        description: "Latitud de la estación, requerida para georreferencia e IDW."
        data_tests:
          - not_null

      - name: longitud
        description: "Longitud de la estación, requerida para georreferencia e IDW."
        data_tests:
          - not_null

  - name: agua_region
    description: "Silver nacional de DS-06 CONAGUA SINA, tipada y deduplicada a nivel punto, indicador y fecha."

    columns:
      - name: id_punto
        description: "Identificador homologado de estación o presa."
        data_tests:
          - not_null

      - name: indicador
        description: "Indicador hídrico reportado por CONAGUA."
        data_tests:
          - not_null

      - name: fecha
        description: "Fecha diaria de observación."
        data_tests:
          - not_null

  - name: rezago_municipio
    description: "Silver nacional de DS-07 CONEVAL, tipada y preservada por municipio y periodo de medición."

    columns:
      - name: cve_mun
        description: "Clave INEGI municipal homologada a 5 dígitos."
        data_tests:
          - not_null

      - name: periodo_medicion
        description: "Periodo de referencia de la edición CONEVAL."
        data_tests:
          - not_null

      - name: grado_rezago
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'MUY BAJO'
                  - 'BAJO'
                  - 'MEDIO'
                  - 'ALTO'
                  - 'MUY ALTO'
                  - 'SIN_DATO'

      - name: indice_rezago_social_cobertura
        data_tests:
          - accepted_values:
              arguments:
                values: ['OK', 'SIN_DATO']

      - name: pobreza_pct_cobertura
        data_tests:
          - accepted_values:
              arguments:
                values: ['OK', 'SIN_DATO']

  - name: poblacion_municipio
    description: "Silver nacional de DS-08 CONAPO, tipada y deduplicada por municipio, año y grupo de edad."

    columns:
      - name: cve_ent
        description: "Clave INEGI de entidad homologada a 2 dígitos."
        data_tests:
          - not_null

      - name: cve_mun
        description: "Clave INEGI municipal homologada a 5 dígitos."
        data_tests:
          - not_null

      - name: anio
        description: "Año de la proyección de población."
        data_tests:
          - not_null

      - name: grupo_edad
        description: "Edad o grupo etario homologado desde la columna de origen."
        data_tests:
          - not_null

      - name: poblacion
        description: "Población proyectada."
        data_tests:
          - not_null