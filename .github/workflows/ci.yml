name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Test de regresión de BUG-009 (DEC-011)
  # ═══════════════════════════════════════════════════════════════════
  # `dbt parse` renderiza el manifest COMPLETO del proyecto sin conectarse a
  # ninguna base. Es exactamente el paso que fallaba en BUG-009: una var sin
  # default rompía el build entero aunque el modelo seleccionado no la usara.
  # Si alguien agrega una fuente o un modelo con `var()` sin default, este job
  # se pone rojo en su PR en vez de descubrirse tres semanas después.
  # El perfil se genera aquí mismo con valores dummy — `parse` no abre conexión,
  # y así no versionamos nada que parezca una credencial (vault/07_Security/Secrets_Policy.md).
  dbt-contract:
    name: Contrato dbt (parse)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dbt
        # Solo dbt, no `requirements/celula-1.txt` completo: ese trae Airflow,
        # Great Expectations, pandas y polars — minutos de instalación para un
        # check que solo necesita renderizar Jinja. Versiones clavadas a las
        # mismas que usa la Célula 1.
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.12.0" "dbt-postgres==1.11.0"
      - name: Perfil dummy (parse no conecta a la base)
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'YAML'
          faro:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: faro
                schema: public
                threads: 1
          YAML
      - name: dbt parse — todas las vars deben tener default
        working-directory: dbt
        run: |
          dbt parse --target ci --no-partial-parse

  # ═══════════════════════════════════════════════════════════════════
  # Quality gate: lint, pruebas y vault (US-523b)
  # ═══════════════════════════════════════════════════════════════════
  # NOTA (US-523b, Edgar Ulises Jiménez López):
  # Se removió el `|| true` que traía el paso de Ruff. Con `|| true` el step
  # de lint NUNCA hacía fallar el job, aunque hubiera errores de estilo o
  # sintaxis — es decir, el "gate" no bloqueaba nada en la práctica. Ahora,
  # si Ruff encuentra errores, el step falla, el job se pone en rojo y el PR
  # queda bloqueado para merge, que es justamente el objetivo de la historia:
  # "Configurar el gate de CI que corre lint y pytest; bloquea el merge si falla."
  quality:
    name: Calidad de codigo y vault
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitLeaks necesita historial completo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Vault lint
        run: python vault/_Meta/scripts/vault_lint.py .
      - name: Validar tablero PM
        run: python vault/_Meta/scripts/validate_pm_dashboard.py .
      - name: Ruff
        # US-523b: se quita "|| true" — si Ruff falla, el job falla y bloquea el merge.
        run: ruff check . --output-format=github
      - name: Pytest
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/ -q
          else
            echo "Sin pruebas aun"
          fi
      - name: Sin secretos versionados
        run: |
          # Cualquier archivo que TERMINE en .env, no solo el literal ".env" — un nombre como
          # configuracion.env quedaba fuera del patrón anterior (hallazgo de Marina García,
          # 2026-09-03). El respaldo real de contenido es G5 GitLeaks, más abajo.
          #
          # PR-208 lo probó en carne propia: este check corre sobre TODO `git ls-files`, no solo
          # lo que cambia el PR, así que ampliar el patrón dejó bloqueado a CUALQUIER PR futuro
          # por un archivo ya commiteado antes del hallazgo. `guia-ambiente-local/configuracion.env`
          # queda con excepción explícita — contenido verificado sin secretos (solo puertos y una
          # URI local), y GitLeaks lo sigue escaneando por contenido en cada PR igual que a todo
          # lo demás. La excepción es del nombre de archivo, no del escaneo.
          if git ls-files | grep -E '(^|/)[^/]*\.env$|\.pem$|\.key$|credentials.*\.json$' \
              | grep -vxF 'guia-ambiente-local/configuracion.env'; then
            echo "Archivos sensibles detectados"; exit 1
          fi
          echo "OK"
      - name: Sin archivos pesados
        run: |
          BIG=$(git ls-files | xargs -I{} du -k "{}" 2>/dev/null | awk '$1>5120 {print $2}')
          if [ -n "$BIG" ]; then echo "Archivos >5MB:"; echo "$BIG"; exit 1; fi
          echo "OK"
      - name: G5 Secret scan con GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Extiende las reglas por defecto (useDefault=true) y solo exime un falso
          # positivo histórico puntual: un ID de revisión de Cloud Run que la regla
          # generic-api-key confunde con un secreto. Ver .github/gitleaks.toml (BUG-079).
          GITLEAKS_CONFIG: .github/gitleaks.toml
      - name: G6 Dependency audit con pip-audit
        run: |
          echo "Escaneando dependencias contra CVE database..."
          pip-audit --desc on --format json > audit-report.json || true
          if [ -f audit-report.json ]; then
            VULNS=$(cat audit-report.json | grep -o '"id":' | wc -l || echo 0)
            if [ "$VULNS" -gt 0 ]; then
              echo "Se encontraron $VULNS vulnerabilidades"
              cat audit-report.json
              echo "Revisar vulnerabilidades antes de merge"
            else
              echo "Sin vulnerabilidades detectadas"
            fi
          fi
