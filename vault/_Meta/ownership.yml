# Verde para todos, sin declararlo persona por persona. {id} = la identidad del autor;
# las entradas sin {id} son comunes a todos por igual.
#
# Aquí vive lo que la plantilla de PR exige a CUALQUIER autor en casilla obligatoria. Si algo
# es requisito para abrir un PR, tiene que estar permitido para quien lo abre — de lo contrario
# el gate de propiedad y el de plantilla se contradicen y nadie puede entregar.
comunes:
  - "vault/_DevLog/*-{id}-*.md"
  - "vault/09_AI_Governance/Agent_Contexts/{id}-agent-context.md"
  # Índice de DevLog: append-only, una fila por PR (`merge=union` en .gitattributes).
  - "vault/_DevLog/_index.md"
  # Matriz de trazabilidad: cada autor actualiza SU fila y el PM consolida — es lo que dice
  # la tabla 🟡 de los 21 Agent Contexts. Sigue en `criticos`, así que el gate avisa a quién
  # pedirle revisión, pero ya no reprueba.
  - "vault/02_Requirements/Traceability_Matrix.md"
  # Infraestructura de la raíz, compartida por todo el repositorio.
  - ".gitignore"
  - ".gitattributes"
  # Registros de intake: `Definition_of_Filed` obliga a CUALQUIERA a dar de alta ahí el bug,
  # el riesgo, el bloqueo o el hallazgo que encuentre. Si el registro no está permitido para
  # quien reporta, la regla no se puede cumplir. Son append-only y sus dueños de área siguen
  # en `criticos`, así que el gate avisa a quién pedirle revisión sin reprobar el PR.
  # Hallazgo de Marina García (2026-09-03): solo Automated/** y Bug_Register.md tenían dueño.
  # _index.md, Test_Strategy.md, los planes de usabilidad/accesibilidad (US-215a/b) y el resto
  # de la carpeta reprobaban a cualquiera, incluido quien los escribiera. La carpeta completa es
  # de consulta/registro de QA, mismo espíritu que Bug_Register.md — no lógica de un área.
  - "vault/06_Quality_Testing/**"
  - "vault/07_Security/Security_Audit_Log.md"
  - "vault/10_Risk_Governance/Risk_Register.md"
  - "vault/10_Risk_Governance/Blocker_Register.md"
  - "vault/10_Risk_Governance/Decision_Log.md"
  - "vault/10_Risk_Governance/Incident_Log.md"
  # Huecos reales hallados 2026-09-03 (Christian Ruiz, US-402/403/404): ninguna
  # persona tenía estas dos rutas en su alcance, así que el gate reprobaba a
  # quien las tocara sin importar quién fuera. Un ADR y una variable de entorno
  # nueva son responsabilidad de quien hace el cambio de arquitectura, no de
  # una sola célula.
  - "vault/03_Architecture/ADRs/**"
  - ".env.example"
  # Hueco real hallado 2026-09-04 (Diana Alvarez, freeze de US-106): el archivo del freeze
  # del esquema Gold no estaba en ningun verde/amarillo de C1 ni en comunes -- ni la propia
  # dueña del contenido podia aplicar su flip draft->approved. Freezes de esquema son
  # decision compartida (regla 7, TL de C1 + PM), mismo espiritu que ADRs/**.
  - "vault/03_Architecture/Data_Lineage_US106.md"
  # Hueco real hallado 2026-09-04 (PR #220, Edgar Jimenez): la guia de ambiente local de
  # US-521b vive en vault/_Meta/**, verde exclusivo del PM, asi que su propio dueño no podia
  # actualizar su entrega -- el gate lo reprobaba por tocar su propio documento. Mismo patron
  # que Accessibility.md (Marina) y Data_Lineage_US106.md (Diana). Nota estructural: el
  # documento esta mal ubicado -- es una guia de usuario, no metadatos del vault; moverlo a
  # 00_Start_Here queda como follow-up post-freeze para no romper su PR abierto.
  - "vault/_Meta/US-521b-guia-ambiente-local.md"
  # Hueco real hallado 2026-09-04 (Christian Ruiz, US-405): requirements.txt de
  # la raíz -- el que instala el job "quality" de ci.yml -- no tenía dueño; el
  # padrón solo cubría requirements/** (la carpeta). Sin esto nadie podía agregar
  # streamlit y las 3 pruebas de frontend seguían saltándose en silencio
  # (importorskip). Mismo espíritu que ADRs/**/.env.example arriba: es una
  # dependencia compartida por todo el CI, no de una sola célula.
  - "requirements.txt"

# Rutas que exigen revisión explícita del dueño del área (regla 7 de Vault_Rules).
# Estar en verde no basta: si no eres el dueño, necesitas su aprobación en el PR.
criticos:
  ".github/**": luis-tellez
  "vault/_Meta/**": edgar-coronel
  "vault/07_Security/**": christian-ruiz
  "src/frontend/**": manuel-serrania
  "vault/02_Requirements/Traceability_Matrix.md": edgar-coronel
  "vault/10_Risk_Governance/**": edgar-coronel
  # dags/** es verde de C1 (Diana/Deni/Luis García/Emilio); se abre en amarillo a
  # edgar-jimenez para los callbacks de alerta de US-524b (BUG hallado 2026-09-03:
  # el hueco anterior le reprobaba el gate por "fuera de alcance" antes de llegar
  # a este aviso). Diana revisa cualquier cambio que no sea suyo.
  "dags/**": diana-alvarez
  # Hallazgo de Marina García al verificar su propia auditoría (2026-09-03): abrir
  # vault/06_Quality_Testing/** a comunes (arriba, para resolver H3) se tragó de paso
  # Automated/**, que era amarillo EXCLUSIVO de C3. coincide() no soporta exclusión de
  # globs, así que no hay forma de sacarlo del `**` de comunes — esta línea es la única
  # vía mecánica para que el gate vuelva a avisar cuando alguien fuera de C3 lo toque.
  "vault/06_Quality_Testing/Automated/**": andres-gonzalez
  # Sin esto, Luis (requirements/** en su amarillo) no se entera cuando C2 finalmente
  # cree requirements/celula-2.txt (hallazgo de Marina, nota menor de la misma revisión).
  "requirements/celula-2.txt": luis-tellez

