# ownership.yml — Fuente única de identidad, rama y permisos
#
# Un solo lugar define quién es cada persona, cuál es su rama y qué archivos puede tocar.
# Los 21 Agent Contexts y la matriz de aislamiento se leen desde aquí; este archivo manda.
#
# La identidad se construye SIEMPRE igual:  {primer-nombre}-{apellido-paterno}
# en minúsculas, ASCII sin acentos, kebab-case. Se ignoran el segundo nombre y el apellido
# materno. Esa identidad es la misma en la rama, el título del PR, el DevLog, el Agent
# Context y el plan de sprint — no existe ninguna otra forma de nombrar a una persona.
#
# Lo verifica en cada PR:  vault/_Meta/scripts/check_ownership.py
#
# El plan de sprint propio (campo `plan:` de cada persona, abajo) NO necesita estar listado
# en su verde/amarillo/comunes: check_ownership.py:212 lo concede sin condición
# (`permitido.append(persona["plan"])`), sea cual sea su ruta. La regla de empate de los 21
# Agent Contexts ("si esta lista y ese archivo no coinciden, manda el archivo") se resuelve
# aquí — en el código del gate, no en las listas de este YAML. Hallazgo de Marina García,
# verificado 2026-09-03: el archivo del plan propio nunca estuvo bloqueado.

