<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Favicon FARO: reemplaza el rayito morado por defecto de Vite (13-sep,
       a peticion de Diana) por un faro (lighthouse), aludiendo al nombre
       del proyecto, en los tonos de la identidad final (faro-command-base
       y faro-signal, ver src/index.css, PR #310). -->
  <rect width="48" height="48" rx="10" fill="#0f172a"/>
  <!-- haz de luz -->
  <path d="M24 6 L38 20 L10 20 Z" fill="#38bdf8" fill-opacity="0.35"/>
  <!-- linterna -->
  <rect x="20" y="8" width="8" height="7" rx="1.5" fill="#38bdf8"/>
  <!-- cuerpo de la torre (franjas) -->
  <path d="M21 15 L27 15 L30 38 L18 38 Z" fill="#f8fafc"/>
  <path d="M22.1 15 L25.9 15 L26.6 22 L21.4 22 Z" fill="#0f172a"/>
  <path d="M22.9 27 L25.1 27 L25.6 33 L22.4 33 Z" fill="#0f172a"/>
  <!-- base -->
  <rect x="14" y="38" width="20" height="4" rx="1" fill="#0284c7"/>
</svg>
